<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5efe4" />

    <!--
      Fonts load from here rather than an @import in index.css: an @import
      is only discovered after the stylesheet itself has downloaded, which
      put two extra round trips in front of the first text render.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    />
    <!-- Every visitor's first request after the page: the CV availability check. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />

    <title>Ahmed Jatlaoui | Software Developer</title>
    <meta
      name="description"
      content="An interactive 3D library portfolio: projects, skills, experience and contact for Ahmed Jatlaoui, software developer."
    />

    <!--
      Link previews.

      ONE THING TO CHANGE BEFORE LAUNCH: replace https://example.com below
      with the real domain, in all three places. Facebook, LinkedIn,
      WhatsApp, Slack and X all require og:url and og:image to be absolute
      URLs. A relative path is silently ignored and the card falls back to
      a bare link, which is exactly what this portfolio showed before these
      tags existed.

      The image itself is not committed: drop a 1200x630 JPEG at
      public/og-image.jpg (see the note beside it for how to take one).
    -->
    <link rel="canonical" href="https://example.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ahmed Jatlaoui" />
    <meta property="og:title" content="Ahmed Jatlaoui | Software Developer" />
    <meta
      property="og:description"
      content="Step into an interactive 3D library. Projects, skills, experience and contact, or skip the room for the plain version."
    />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:image" content="https://example.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A warm, sunlit 3D room with a bookshelf, desk and window." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ahmed Jatlaoui | Software Developer" />
    <meta
      name="twitter:description"
      content="Step into an interactive 3D library. Projects, skills, experience and contact, or skip the room for the plain version."
    />
    <meta name="twitter:image" content="https://example.com/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
